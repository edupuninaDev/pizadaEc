services:
  postgres:
    image: postgres:16-alpine
    container_name: pizadaec_postgres
    environment:
      POSTGRES_DB: pizadaec
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - pizadaec_postgres_data:/var/lib/postgresql/data
    networks:
      - pizadaec_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pizadaec_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pizadaec.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - pizadaec_network

volumes:
  pizadaec_postgres_data:

networks:
  pizadaec_network:
    driver: bridge